name: Sync games from Play Store

on:
  schedule:
    - cron: "17 3 * * *"   # daily at ~03:17 UTC
  workflow_dispatch: {}     # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync games.json from Play Store
        run: node scripts/sync-games.mjs

      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain games.json)" ]; then
            git config user.name "akheer-sync-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add games.json
            git commit -m "Auto-sync games from Play Store"
            git push
            echo "games.json updated and pushed."
          else
            echo "No changes to games.json."
          fi
